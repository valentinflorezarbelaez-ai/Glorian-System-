name: Feature request
description: Propose a capability, spec, or improvement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest change that solves it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and acceptance criteria
      description: How will we know it works? Which spec, test, or metric changes?
    validations:
      required: true
  - type: dropdown
    id: blast
    attributes:
      label: Blast radius
      options:
        - Documentation only
        - Tooling and CI
        - Single repository
        - Fleet-wide
    validations:
      required: true
