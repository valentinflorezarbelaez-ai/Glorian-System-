name: Bug report
description: Report a defect in the control plane, a governed repository, or the public sites.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do **not** open a public issue. Follow SECURITY.md.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the failing command, stage number, and error output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run `npm run verify:strict`
        2. Observe stage 4/7 failing in test/...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, and commit SHA.
    validations:
      required: true
