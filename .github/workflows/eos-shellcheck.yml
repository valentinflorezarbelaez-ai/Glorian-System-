name: EOS Shell Script Lint

# Big Tech standard (Google, Meta): lint shell scripts for common bugs,
# quoting issues, and unsafe patterns. The .githooks/ directory contains
# shell scripts that run on every commit — a bug there blocks all commits.

on:
  pull_request:
    branches: [main]
    paths:
      - ".githooks/**"
      - "*.sh"
  push:
    branches: [main]
    paths:
      - ".githooks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck .githooks/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b18b53087cba7573e0a31d48579d331d23f1f6 # 2.0.0
        with:
          scandir: ".githooks"
          severity: warning
          format: gcc
