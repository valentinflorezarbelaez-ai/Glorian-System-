name: EOS PR Labeler

# Big Tech standard (Kubernetes, Angular, Meta): auto-label PRs based on
# the paths they modify so reviewers and dashboards can filter by area.
# https://github.com/actions/labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout (labeler config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply labels
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881faea7e4dc1 # v5.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
