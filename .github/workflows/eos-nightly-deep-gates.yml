name: EOS Nightly Deep Quality Gates

# Ritual (P3-2 / PR-M — docs/governance/NIGHTLY_MUTATION_FLAKY.md):
# The expensive gates (mutation ×N, flaky ×N) are opt-in inside the per-commit
# pipeline (Stage 4.6 / 4.7) so the developer loop stays fast — PR / verify:strict
# paths MUST leave EOS_MUTATION unset (SKIP). This scheduled workflow closes the
# anti-tautology gap by enabling EOS_MUTATION=1 / EOS_FLAKY=1 with *_ENFORCE=1
# (fail-closed), exercising the versioned ratchets (`docs/quality/*.json`), and
# publishing MUTATION_NIGHTLY / FLAKY_NIGHTLY artifacts. Fail-closed: ratchet
# drift fails the job.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      update-ratchets:
        description: "Recompute the ratchets and open a refresh pull request"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Stage 4.6 / 4.7 env contract — nightly only (do NOT copy onto PR paths).
env:
  EOS_MUTATION: "1"
  EOS_MUTATION_ENFORCE: "1"
  EOS_FLAKY: "1"
  EOS_FLAKY_ENFORCE: "1"
  EOS_FLAKY_REPEATS: "3"

jobs:
  mutation-deep-gate:
    name: Mutation deep gate (SPEC-143)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install locked development toolchain
        run: npm ci --include=dev

      - name: Run mutation gate against the frozen ratchet (fail-closed)
        run: |
          set -o pipefail
          # Reuses scripts/mutation-gate.mjs (same engine Stage 4.6 loads when EOS_MUTATION=1).
          node scripts/mutation-gate.mjs 2>&1 | tee mutation-report.txt
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const report = fs.readFileSync("mutation-report.txt", "utf8");
            const sha256 = crypto.createHash("sha256").update(report).digest("hex");
            const receipt = {
              kind: "MUTATION_NIGHTLY",
              epistemicState: "NIGHTLY_FAIL_CLOSED",
              stage: "4.6",
              eosMutation: process.env.EOS_MUTATION === "1",
              eosMutationEnforce: process.env.EOS_MUTATION_ENFORCE === "1",
              workflow: process.env.GITHUB_WORKFLOW || "eos-nightly-deep-gates",
              runId: process.env.GITHUB_RUN_ID || null,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT || null,
              sha: process.env.GITHUB_SHA || null,
              timestampIso: new Date().toISOString(),
              reportSha256: sha256,
              exitPolicy: "fail-closed",
            };
            fs.mkdirSync("docs/evidence", { recursive: true });
            fs.writeFileSync("docs/evidence/MUTATION_NIGHTLY.json", JSON.stringify(receipt, null, 2) + "\n");
            console.log("Wrote docs/evidence/MUTATION_NIGHTLY.json sha256=" + sha256.slice(0, 24) + "...");
          '

      - name: Publish mutation report to the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Mutation deep gate (MUTATION_NIGHTLY)"
            echo ""
            echo '```'
            cat mutation-report.txt 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MUTATION_NIGHTLY artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MUTATION_NIGHTLY
          path: |
            mutation-report.txt
            docs/evidence/MUTATION_NIGHTLY.json
          if-no-files-found: error
          retention-days: 30

  flaky-deep-gate:
    name: Flaky deep gate (SPEC-131)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install locked development toolchain
        run: npm ci --include=dev

      - name: Re-run the suite N times against the frozen quarantine (fail-closed)
        run: |
          set -o pipefail
          # Reuses scripts/flaky-gate.mjs (same engine Stage 4.7 loads when EOS_FLAKY=1).
          node scripts/flaky-gate.mjs --repeat="${EOS_FLAKY_REPEATS:-3}" 2>&1 | tee flaky-report.txt
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const report = fs.readFileSync("flaky-report.txt", "utf8");
            const sha256 = crypto.createHash("sha256").update(report).digest("hex");
            const receipt = {
              kind: "FLAKY_NIGHTLY",
              epistemicState: "NIGHTLY_FAIL_CLOSED",
              stage: "4.7",
              eosFlaky: process.env.EOS_FLAKY === "1",
              eosFlakyEnforce: process.env.EOS_FLAKY_ENFORCE === "1",
              repeats: Number(process.env.EOS_FLAKY_REPEATS) || 3,
              workflow: process.env.GITHUB_WORKFLOW || "eos-nightly-deep-gates",
              runId: process.env.GITHUB_RUN_ID || null,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT || null,
              sha: process.env.GITHUB_SHA || null,
              timestampIso: new Date().toISOString(),
              reportSha256: sha256,
              exitPolicy: "fail-closed",
            };
            fs.mkdirSync("docs/evidence", { recursive: true });
            fs.writeFileSync("docs/evidence/FLAKY_NIGHTLY.json", JSON.stringify(receipt, null, 2) + "\n");
            console.log("Wrote docs/evidence/FLAKY_NIGHTLY.json sha256=" + sha256.slice(0, 24) + "...");
          '

      - name: Publish flaky report to the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Flaky deep gate (FLAKY_NIGHTLY)"
            echo ""
            echo '```'
            cat flaky-report.txt 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FLAKY_NIGHTLY artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FLAKY_NIGHTLY
          path: |
            flaky-report.txt
            docs/evidence/FLAKY_NIGHTLY.json
          if-no-files-found: error
          retention-days: 30

  nocturnal-evolution-gate:
    name: Darwinian nocturnal evolution sweep (SPEC-133)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install locked development toolchain
        run: npm ci --include=dev

      - name: Run Darwinian nocturnal evolution sweep
        run: |
          set -o pipefail
          npm run nocturnal 2>&1 | tee nocturnal-report.txt

      - name: Publish nocturnal report to the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Darwinian Nocturnal Evolution Gate (SPEC-133)"
            echo ""
            echo '```'
            cat nocturnal-report.txt 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  llmops-privacy-lane-gate:
    name: LLMOps privacy lane continuous gate (SPEC-183)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install locked development toolchain
        run: npm ci --include=dev

      - name: Run privacy lane hermetic suite (local + open_weight modes)
        env:
          EOS_LLM_PRIVACY_LANE: local
        run: |
          set -o pipefail
          node --test test/eosLlmOpsPrivacyLane.test.mjs 2>&1 | tee llmops-privacy-report.txt
          EOS_LLM_PRIVACY_LANE=open_weight node --test test/eosLlmOpsPrivacyLane.test.mjs 2>&1 | tee -a llmops-privacy-report.txt

      - name: Publish LLMOps privacy report to the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### LLMOps privacy lane (SPEC-183)"
            echo ""
            echo '```'
            cat llmops-privacy-report.txt 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tlc-formal-model-gate:
    name: Leslie Lamport TLC formal model checker gate (SPEC-270)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 21 for TLC
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Cache or download tla2tools.jar
        run: |
          mkdir -p tools
          if [ ! -f tools/tla2tools.jar ]; then
            echo "Downloading Leslie Lamport TLC tla2tools.jar..."
            curl -fsSL -o tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          fi

      - name: Run TLC formal verification and negative calibration
        run: |
          set -o pipefail
          node scripts/run-tlc.mjs --negative-calibration
          node scripts/run-tlc.mjs 2>&1 | tee tlc-report.txt

      - name: Publish TLC report to the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Leslie Lamport TLC Formal Verification Gate (SPEC-270)"
            echo ""
            echo '```'
            cat tlc-report.txt 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ratchet-refresh:
    name: Refresh ratchets and open a pull request
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update-ratchets }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install locked development toolchain
        run: npm ci --include=dev

      - name: Prune the flaky quarantine (the ratchet may only shrink)
        run: node scripts/flaky-gate.mjs --update

      - name: Raise the mutation floors (the ratchet may only grow)
        run: node scripts/mutation-gate.mjs --update

      - name: Refresh the size budget (grandfathered ceilings may only shrink)
        run: node scripts/size-budget.mjs --update

      - name: Refresh the bundle size budget (frontend gzip ratchet)
        run: node scripts/bundle-budget.mjs --update

      - name: Detect ratchet drift
        id: drift
        run: |
          if git diff --quiet -- docs/quality; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the ratchet-refresh pull request
        if: ${{ steps.drift.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/ratchet-refresh-${{ github.run_id }}"
          git checkout -b "$branch"
          git add docs/quality
          git commit -m "chore(quality): refresh mutation/flaky/size ratchets"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$branch"
          gh pr create \
            --title "chore(quality): refresh mutation/flaky ratchets" \
            --body "Automated ratchet refresh from the nightly deep-gates workflow. The mutation floors may only rise, the flaky quarantine may only shrink, and grandfathered size ceilings may only fall; review the deltas before merging." \
            --base main \
            --head "$branch"
