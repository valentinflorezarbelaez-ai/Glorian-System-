name: EOS Semgrep Multi-Language SAST

# Big Tech standard (Google, Meta, Dropbox): Semgrep provides multi-language
# SAST that covers TypeScript, JavaScript, Go, and Rust — languages CodeQL
# doesn't fully cover. Uses the auto-config ruleset (OWASP Top 10, security
# best practices, and language-specific patterns). Results upload as SARIF
# to the GitHub Security tab alongside CodeQL.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1" # Monday 05:30 UTC

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep scan
        run: semgrep ci --config=auto --sarif --output=semgrep-results.sarif
        env:
          SEMGREP_RULES: "p/owasp-top-ten,p/typescript,p/javascript,p/golang,p/rust"

      - name: Upload Semgrep results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: semgrep-results.sarif
