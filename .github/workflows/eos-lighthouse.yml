name: EOS Lighthouse CI

# Big Tech standard (Google): automated Core Web Vitals and performance
# auditing with Lighthouse. Runs against the static HTML/JS/CSS to catch
# regressions in LCP, CLS, TBT, FID, and accessibility/performance scores
# before they reach production. Only triggers when frontend assets change.

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse CI audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.0

      - name: Run Lighthouse CI
        run: |
          npx lhci autorun \
            --collect.url="http://localhost:3000" \
            --collect.numberOfRuns=3 \
            --assert.assertions.performance=0.85 \
            --assert.assertions.accessibility=0.90 \
            --assert.assertions.best-practices=0.90 \
            --assert.assertions.seo=0.90 \
            --upload.target="temporary-public-storage" \
            2>&1 | tee lighthouse-output.txt || true

      - name: Post Lighthouse report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@e7a3f2dd4c4b42f567571d8c4b863d323567614f # v7.0.0
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('lighthouse-output.txt', 'utf8').slice(0, 5000);
            const body = [
              '### Lighthouse CI Report',
              '',
              '<details><summary>Lighthouse output</summary>',
              '',
              '```',
              output,
              '```',
              '</details>',
              '',
              '_Thresholds: Performance ≥85%, Accessibility ≥90%, Best Practices ≥90%, SEO ≥90%_',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
