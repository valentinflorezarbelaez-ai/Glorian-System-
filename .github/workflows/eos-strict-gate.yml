name: EOS Strict Sovereign Gate (SPEC-096)

on:
  workflow_call:
    inputs:
      fail-fast:
        description: 'Terminate immediately on first gate finding'
        required: false
        type: boolean
        default: true
      export-sarif:
        description: 'Export and upload OASIS SARIF v2.1.0 security receipt'
        required: false
        type: boolean
        default: true
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  eos-strict-attestation:
    name: EOS 7-Stage Strict Gate Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js Layer-0 Runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install locked development toolchain
        run: npm ci --ignore-scripts

      - name: Run EOS Criterial Gate Attestation
        run: |
          node scripts/eos-github-pr-attestation.mjs

      - name: Upload OASIS SARIF v2.1.0 Security Receipt
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: docs/evidence/local-checks.sarif
