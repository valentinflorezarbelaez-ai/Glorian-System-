name: EOS Parallel Test Shards

# Big Tech standard (Google, Meta, Kubernetes): divide the test suite into
# N parallel shards across separate CI runners to reduce wall-clock time.
# The full 7-stage gate (eos-gate.yml) still runs as the authoritative gate;
# this workflow provides faster signal by running shards in parallel.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eos-test-shards-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-shard:
    name: "Shard ${{ matrix.shard }}/4"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked development toolchain
        run: npm ci

      - name: Run test shard ${{ matrix.shard }}/4
        run: node scripts/test-shard.mjs --index=${{ matrix.shard }} --total=4
        env:
          NODE_OPTIONS: --max-old-space-size=4096
