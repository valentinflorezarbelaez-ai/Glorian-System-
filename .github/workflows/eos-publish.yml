name: EOS Publish — npm + VSIX

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    name: "Publish @eos-system/core to npm"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Type-check core package
        run: node scripts/verify-typescript.mjs

      - name: Publish @eos-system/core
        run: |
          cd packages/core
          # Copy src/core and src/mcp into the package dist
          mkdir -p dist
          # The index.ts uses relative imports back to src/core — for publish we need to bundle
          # For now, publish as-is with the src pointing to the monorepo root
          # Real publish would use tsc to compile, but we keep zero-dep philosophy
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-vsix:
    name: "Build VS Code Extension VSIX"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Extension
        run: |
          cd packages/vscode-extension
          node build.mjs

      - name: Install vsce and Package
        run: |
          npm install -g @vscode/vsce
          cd packages/vscode-extension
          vsce package --no-yarn || true

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eos-vscode-extension
          path: packages/vscode-extension/*.vsix
          retention-days: 90
