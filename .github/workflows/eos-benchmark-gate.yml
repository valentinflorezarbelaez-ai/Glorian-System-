name: EOS Benchmark Regression Gate

# Big Tech standard (Google Benchmark Dashboard, Meta's perfbot, Netflix
# Performance Engineering): prevent performance regressions from merging
# by comparing nano-benchmark results against a frozen baseline. The
# project already ships EosBenchmarkTracker and eosNanoBenchmarkEngine —
# this workflow wires them into a per-PR gate.
#
# Advisory-only initially: posts a comment with the delta. Set
# EOS_BENCH_HARD_GATE=1 to block merges on regression.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Nano-benchmark regression check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked development toolchain
        run: npm ci

      - name: Run nano-benchmark suite
        run: node bin/eos.mjs bench:nano 2>&1 | tee bench-output.txt

      - name: Run performance regression check
        run: node bin/eos.mjs perf 2>&1 | tee perf-output.txt || true

      - name: Post benchmark report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@e7a3f2dd4c4b42f567571d8c4b863d323567614f # v7.0.0
        with:
          script: |
            const fs = require('fs');
            const bench = fs.readFileSync('bench-output.txt', 'utf8').slice(0, 5000);
            const perf = fs.readFileSync('perf-output.txt', 'utf8').slice(0, 5000);
            const hardGate = process.env.EOS_BENCH_HARD_GATE === '1';
            const body = [
              '### Benchmark Regression Report',
              '',
              '<details><summary>Nano-benchmark output</summary>',
              '',
              '```',
              bench,
              '```',
              '</details>',
              '',
              '<details><summary>Performance regression check</summary>',
              '',
              '```',
              perf,
              '```',
              '</details>',
              '',
              hardGate ? '⚠️ **Hard gate enabled** — regressions block the merge.' : 'ℹ️ **Advisory only** — regressions are reported but do not block.',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          EOS_BENCH_HARD_GATE: ${{ vars.EOS_BENCH_HARD_GATE }}
