name: EOS Coverage Report Comment

# Big Tech standard (Codecov, Meta, Google): post a coverage report as a
# PR comment so reviewers can see what's covered without leaving the PR.
# Uses the existing zero-dep coverage-gate.mjs — no external service needed.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage-comment:
    name: Post coverage report to PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked development toolchain
        run: npm ci

      - name: Run coverage gate and capture output
        id: coverage
        run: |
          node scripts/coverage-gate.mjs 2>&1 | tee coverage-output.txt || true
          # Extract the three metrics from the output
          LINES=$(grep -oP 'Lines:\s*\K[\d.]+' coverage-output.txt | head -1)
          BRANCHES=$(grep -oP 'Branches:\s*\K[\d.]+' coverage-output.txt | head -1)
          FUNCTIONS=$(grep -oP 'Functions:\s*\K[\d.]+' coverage-output.txt | head -1)
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "functions=$FUNCTIONS" >> "$GITHUB_OUTPUT"

      - name: Post coverage comment
        uses: actions/github-script@e7a3f2dd4c4b42f567571d8c4b863d323567614f # v7.0.0
        with:
          script: |
            const lines = '${{ steps.coverage.outputs.lines }}';
            const branches = '${{ steps.coverage.outputs.branches }}';
            const functions = '${{ steps.coverage.outputs.functions }}';

            const lineStatus = parseFloat(lines) >= 80 ? '✅' : '❌';
            const branchStatus = parseFloat(branches) >= 65 ? '✅' : '❌';
            const funcStatus = parseFloat(functions) >= 75 ? '✅' : '❌';

            const body = [
              '### 📊 Code Coverage Report',
              '',
              '| Metric | Coverage | Threshold | Status |',
              '|--------|----------|-----------|--------|',
              `| Lines | ${lines}% | ≥80% | ${lineStatus} |`,
              `| Branches | ${branches}% | ≥65% | ${branchStatus} |`,
              `| Functions | ${functions}% | ≥75% | ${funcStatus} |`,
              '',
              '_Generated by `scripts/coverage-gate.mjs` (zero deps, native V8 coverage)_',
            ].join('\n');

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '### 📊 Code Coverage Report';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
