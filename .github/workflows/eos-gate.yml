name: EOS Sovereign Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  eos-gate:
    name: EOS SecDevOps & Contract Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24 (Strip-Only TypeScript Standard)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked development toolchain
        run: npm ci

      - name: Setup Java 21 (for Leslie Lamport TLC Formal Model Checker)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Ensure TLC Formal Tools Jar is Installed
        run: node bin/eos.mjs tlc install

      - name: Verify Layer-0 Purity & Typecheck
        run: npm run typecheck

      - name: Verify Formal TLA+ Models (Dual-Mode Engine)
        run: node scripts/verify-formal-tla.mjs

      - name: Run 7-Stage SecDevOps Quality Pipeline
        run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build & Verify Go Fleet Gateway
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
      - name: Compile & Smoke-Test Go Edge Gateway (fail-closed)
        working-directory: templates/glorian-fleet-gateway
        run: go build -ldflags="-s -w" -o glorian-gateway . && go run . --help

      - name: Verify Docker Multi-Stage Build
        run: docker build -t glorian-gateway:test templates/glorian-fleet-gateway/

      - name: Run ESLint Static Analysis
        run: npm run lint

      - name: Enforce Prettier Formatting
        run: npm run format:check

      - name: Run Accessibility Static Checks (WCAG 2.1 AA)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/a11y-check.mjs

      - name: Enforce Bundle Size Budget (frontend gzip)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/bundle-budget.mjs

      - name: License Compliance Audit
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/license-audit.mjs

      - name: Import Boundary Gate (Layer-0 isolation, Law V)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/import-boundary-gate.mjs

      - name: Code Complexity Gate (cyclomatic ≤15)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/complexity-gate.mjs

      - name: PWA Validation (manifest + service worker)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/pwa-validate.mjs

      - name: MCP Server Smoke Test (JSON-RPC 2.0)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/mcp-smoke-test.mjs

      - name: Unused Dependency Check
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/unused-deps-check.mjs

      - name: CODEOWNERS Validation
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/codeowners-validate.mjs

      - name: Markdown Link Checker
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/link-checker.mjs

      - name: Run Coverage Gate (Line ≥80%, Branch ≥65%, Function ≥75%)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/coverage-gate.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Generate SBOM (CycloneDX 1.6)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/sbom-gate.mjs

      - name: Upload SBOM as CI Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cdx-${{ github.sha }}
          path: docs/evidence/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

      - name: Generate Build Provenance Attestation (SLSA L3)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: actions/attest-build-provenance@e8998e9431f8212ec1abc6095f8e5b4d3b0373ea # v2.4.0
        with:
          subject-name: glorian-system-sbom
          subject-digest: sha256:${{ github.sha }}
          predicate-type: https://slsa.dev/provenance/v1
        permissions:
          attestations: write
          id-token: write

      - name: Evaluate EOS Pull Request Gate & Attestation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/eos.mjs pr:check

      - name: Publish CI Summary
        if: always()
        run: |
          {
            echo "## EOS Sovereign Quality Gate — Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Typecheck | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| TLA+ Formal Models | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| 7-Stage Pipeline | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Go Fleet Gateway | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Docker Build | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| ESLint | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Prettier Format | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| A11y (WCAG 2.1) | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Bundle Size | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| License Audit | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Import Boundary | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Complexity ≤15 | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| PWA Validation | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| MCP Smoke Test | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Unused Deps | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| CODEOWNERS | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Link Checker | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Coverage ≥80% | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| SBOM (CycloneDX) | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| PR Attestation | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo ""
            echo "_OS: ${{ matrix.os }} | Node: 24 | Generated at $(date -u +'%Y-%m-%dT%H:%M:%SZ')_"
          } >> "$GITHUB_STEP_SUMMARY"
