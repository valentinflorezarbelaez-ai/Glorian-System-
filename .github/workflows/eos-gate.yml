name: EOS Sovereign Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  eos-gate:
    name: EOS SecDevOps & Contract Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24 (Strip-Only TypeScript Standard)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked development toolchain
        run: npm ci

      - name: Setup Java 21 (for Leslie Lamport TLC Formal Model Checker)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure TLC Formal Tools Jar is Installed
        run: node bin/eos.mjs tlc install

      - name: Verify Layer-0 Purity & Typecheck
        run: npm run typecheck

      - name: Verify Formal TLA+ Models (Dual-Mode Engine)
        run: node scripts/verify-formal-tla.mjs

      - name: Run 7-Stage SecDevOps Quality Pipeline
        run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build & Verify Go Fleet Gateway
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
      - name: Compile Go Edge Gateway
        working-directory: templates/glorian-fleet-gateway
        run: go build -ldflags="-s -w" -o glorian-gateway . && ./glorian-gateway --help || true

      - name: Verify Docker Multi-Stage Build
        run: docker build -t glorian-gateway:test templates/glorian-fleet-gateway/

      - name: Run ESLint Static Analysis
        run: npm run lint

      - name: Run Coverage Gate (Line ≥80%, Branch ≥65%, Function ≥75%)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/coverage-gate.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Generate SBOM (CycloneDX 1.6)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/sbom-gate.mjs

      - name: Upload SBOM as CI Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cdx-${{ github.sha }}
          path: docs/evidence/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

      - name: Evaluate EOS Pull Request Gate & Attestation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/eos.mjs pr:check
