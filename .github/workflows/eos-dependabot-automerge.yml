name: EOS Dependabot Auto-Merge

# Big Tech standard (Google, Meta, Stripe): auto-merge low-risk dependency
# updates (patch/minor) after CI passes. Major updates and new dependencies
# always require manual review. This keeps the lockfile fresh without
# forcing a human to click "merge" on every patch bump.
#
# Requires: GitHub "Allow auto-merge" enabled in repo settings.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge safe dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@8e87152f2d4e4b2ce48637e7095f4e5e4b9e4e4e # v2.3.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto \
            --squash \
            --subject "chore(deps): ${{ github.event.pull_request.title }}" \
            --body "Auto-merged by dependabot-automerge workflow (patch/minor update, CI passed)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave a note for major updates (requires manual review)
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "This is a **major** dependency update. It requires manual review and approval before merging. CI must pass before auto-merge can be enabled."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
