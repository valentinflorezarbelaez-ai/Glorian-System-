name: EOS All-Contributors Auto-Update

# Big Tech standard (Node.js, Vue, Angular): automatically recognize
# contributors by adding them to the README contributors table based on
# their contribution types (code, docs, tests, review, ideas, etc.).
# Triggered by a comment "/all-contributors add @user for code,docs".

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  allcontributors:
    name: Process contributor addition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '/all-contributors')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install all-contributors-cli
        run: npm install -g all-contributors-cli@6.30.1

      - name: Process comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          # Parse the comment: "/all-contributors add @user for code,docs,review"
          echo "$COMMENT_BODY" | grep -oP '/all-contributors add @\S+ for \S+' || exit 0
          USERNAME=$(echo "$COMMENT_BODY" | grep -oP '(?<=add @)\S+')
          CONTRIBUTIONS=$(echo "$COMMENT_BODY" | grep -oP '(?<=for )\S+')
          if [ -z "$USERNAME" ] || [ -z "$CONTRIBUTIONS" ]; then exit 0; fi
          all-contributors add "$USERNAME" "$CONTRIBUTIONS"

      - name: Create PR for contributor update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/all-contributors-${{ github.run_id }}"
          git checkout -b "$branch"
          git add README.md .all-contributorsrc
          git commit -m "docs: update all-contributors"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$branch"
          gh pr create --title "docs: update all-contributors" \
            --body "Automated contributor recognition update." \
            --base main --head "$branch"
