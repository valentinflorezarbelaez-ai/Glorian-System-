name: EOS First-Time Contributor Welcome

# Big Tech standard (Node.js, React, Kubernetes, Angular): automatically
# greet first-time contributors with a welcome message and pointers to
# the contribution guide, spec process, and the 7 inviolable laws.
# https://github.com/actions/first-interaction

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  welcome:
    name: Welcome first-time contributor
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Greet first-time contributor
        uses: actions/first-interaction@1c038d67193c0c0c64d3d749202f6fef86425200 # v1.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            Welcome to Glorian System. Thanks for your first pull request.

            Before review, please ensure:

            - **Conventional Commits** — your commit follows `<type>(<scope>): <subject>`. The `commit-msg` hook enforces this.
            - **Law III (Evidence Over Claims)** — run `npm test` and confirm the 7-stage pipeline passes (exit code 0).
            - **Law V (Layer-0 Purity)** — no new runtime dependencies in `package.json` `dependencies`. Only pinned `devDependencies` are allowed.
            - **PR template** — fill in the checklist (type, verification, breaking changes).

            See [CONTRIBUTING.md](CONTRIBUTING.md) for the full guide and [ARCHITECTURE-S0.md](ARCHITECTURE-S0.md) for the design constitution.

          issue-message: |
            Thanks for your first issue in Glorian System.

            - For **bug reports**, include deterministic reproduction steps (Law VII — no wall-clock or network dependence).
            - For **security vulnerabilities**, use [private reporting](https://github.com/valentininflorezarbelaez-ai/Eos-System/security/advisories/new) — do NOT open a public issue.
            - For **feature requests**, draft an OpenSpec following EARS syntax and BDD Given-When-Then scenarios (Law I & II).
