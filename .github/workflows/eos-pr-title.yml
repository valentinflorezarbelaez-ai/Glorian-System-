name: EOS PR Title Convention Check

# Big Tech standard (Angular, React, Kubernetes): enforce that PR titles
# follow Conventional Commits so the git history stays machine-parsable
# for changelog generation and semantic versioning. The commit-msg hook
# checks individual commits; this checks the PR title (which becomes the
# squash-merge commit subject).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate
        uses: amannn/action-verify-pr-title@f2014f8a2e085d3a85c66c1cddeee8e4ae803462 # v4.0.0
        with:
          pattern: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9 _/.-]+\))?(!)?: .{1,120}$'
          error: |
            PR title must follow Conventional Commits format.

            Expected: <type>(<scope>): <subject>
            Example:  feat(core): add ZK proof verifier

            Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
