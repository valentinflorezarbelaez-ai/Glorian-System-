name: EOS Stale Bot

# Big Tech standard (Kubernetes, Node.js, React): automatically mark stale
# issues and PRs and close them if no activity follows. Prevents backlog
# rot and keeps the issue tracker actionable.
# https://github.com/actions/stale

on:
  schedule:
    - cron: "30 4 * * 1" # Monday 04:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues & PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@5f40684c2b851b5e5f3f6dc23a3cd62fc1fd47e9 # v10.0.0
        with:
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: |
            This issue has been inactive for 60 days and is marked as stale.
            Add a comment or reactivate it within 14 days to keep it open.
          close-issue-message: |
            This issue was closed due to inactivity. Reopen if still relevant.
          exempt-issue-labels: "pinned,security,enhancement,blocker"
          # Pull Requests
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: "stale"
          stale-pr-message: |
            This PR has been inactive for 30 days and is marked as stale.
            Rebase or comment within 14 days to keep it open.
          close-pr-message: |
            This PR was closed due to inactivity. Reopen when ready to merge.
          exempt-pr-labels: "pinned,security,blocked"
          operations-per-run: 30
