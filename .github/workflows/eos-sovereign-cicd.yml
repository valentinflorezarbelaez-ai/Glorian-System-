name: EOS Sovereign CI/CD — TypeCheck · 7-Stage SecDevOps · Matrix · DORA · SLSA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions at workflow level; jobs that need more declare it explicitly.
# Google SLSA L3 + Stripe supply-chain standard: principle of least privilege.
permissions:
  contents: read

jobs:
  # ── JOB 1: TypeScript strict type-check ────────────────────────────────────
  typecheck:
    name: "TypeScript Strict Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned SHA — SLSA L3
        with:
          persist-credentials: false

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@1d0ff469b12c6b44b14610a574a4e3163f0d34a5 # pinned SHA — SLSA L3
        with:
          node-version: "22"
          cache: "npm"

      - name: Run TypeScript Strict Type Check
        run: node scripts/verify-typescript.mjs

  # ── JOB 2: Property-based tests (fast, runs in parallel) ───────────────────
  property-tests:
    name: "Property-Based Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned SHA — SLSA L3

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@1d0ff469b12c6b44b14610a574a4e3163f0d34a5 # pinned SHA — SLSA L3
        with:
          node-version: "22"
          cache: "npm"

      - name: Run Property-Based Test Suite
        run: node --test test/eosPropertyBased.test.mjs

  # ── JOB 3: 7-Stage SecDevOps gate — matrix across OS × Node version ────────
  sovereign-gate:
    name: "7-Stage SecDevOps Gate (${{ matrix.os }} · Node ${{ matrix.node }})"
    needs: [typecheck]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, windows-latest]
        node: ["22", "23"]
    runs-on: ${{ matrix.os }}
    env:
      # Netflix chaos standard: chaos tests run in CI on non-prod environments
      EOS_FLAG_CHAOS_IN_CI: "1"
      # Security: production builds must not leak internals via error messages
      NODE_ENV: "production"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned SHA — SLSA L3

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@1d0ff469b12c6b44b14610a574a4e3163f0d34a5 # pinned SHA — SLSA L3
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Execute Stage 1–7 Strict SecDevOps & Constitutional Pipeline
        run: node scripts/verify-cicd-pipeline.mjs

      - name: Upload CI/CD Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eos-cicd-receipts-${{ matrix.os }}-node${{ matrix.node }}
          path: docs/evidence/
          retention-days: 30

      - name: Track DORA Metrics
        run: node scripts/track-dora-metrics.mjs
        continue-on-error: true

  # ── JOB 4: Mutation testing (runs after sovereign gate passes) ─────────────
  mutation-testing:
    name: "Mutation Testing — Kill Score Gate"
    needs: [sovereign-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned SHA — SLSA L3

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@1d0ff469b12c6b44b14610a574a4e3163f0d34a5 # pinned SHA — SLSA L3
        with:
          node-version: "22"
          cache: "npm"

      - name: Run Mutation Testing Runner
        run: node scripts/run-mutation-testing.mjs
        env:
          EOS_MUTATION_THRESHOLD: "60"
          EOS_MAX_MUTANTS: "15"

      - name: Upload Mutation Receipt
        uses: actions/upload-artifact@v4
        with:
          name: eos-mutation-receipt
          path: docs/evidence/MUTATION-RECEIPT.json
          retention-days: 30

  # ── JOB 5: Integration summary & release gate ──────────────────────────────
  integration-summary:
    name: "Integration Summary & Release Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, property-tests, sovereign-gate, mutation-testing]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned SHA — SLSA L3

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@1d0ff469b12c6b44b14610a574a4e3163f0d34a5 # pinned SHA — SLSA L3
        with:
          node-version: "22"

      - name: Generate CHANGELOG
        run: node scripts/generate-changelog.mjs
        continue-on-error: true

      - name: Print Final Integration Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "======================================================================"
          echo " ALL GATES PASSED — EOS v${VERSION} is PRODUCTION_READY"
          echo " TypeCheck ✔ | PBT ✔ | SecDevOps Matrix ✔ | Mutation ✔"
          echo "======================================================================"

  # ── JOB 6: SLSA Provenance Attestation (runs on main push only) ────────────
  # Google SLSA L2+: the build platform must generate signed provenance.
  # Uses GitHub's native build attestation (OIDC-based, no external sigstore needed).
  slsa-provenance:
    name: "SLSA Provenance Attestation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [integration-summary]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write    # needed to create GitHub release (if triggered)
      id-token: write    # needed for OIDC token → sigstore attestation
      attestations: write # needed for actions/attest-build-provenance
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned SHA — SLSA L3

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@1d0ff469b12c6b44b14610a574a4e3163f0d34a5 # pinned SHA — SLSA L3
        with:
          node-version: "22"

      - name: Generate SBOM & In-Toto Provenance Document
        run: node scripts/eos-generate-sbom.mjs
        env:
          NODE_ENV: "production"

      - name: Attest Build Provenance (GitHub native SLSA L2)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            docs/evidence/SBOM-CICD-RECEIPT.json
            package.json

      - name: Upload SBOM Evidence
        uses: actions/upload-artifact@v4
        with:
          name: eos-sbom-provenance
          path: docs/evidence/
          retention-days: 90

      - name: Tag Release Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "EOS System v${VERSION} — SLSA-attested release" || echo "Tag already exists"
          git push origin "v${VERSION}" || echo "Tag push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
