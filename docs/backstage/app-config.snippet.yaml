# Backstage app-config snippet (P1/P2) — NOT a runnable Backstage host.
# Paste into a future portal app-config.yaml / app-config.production.yaml.
# Law V: keep @backstage/* outside src/core and root package.json dependencies.
# Law VI: public GitHub / Vercel URLs only — never embed tokens or PATs.
#
# Single ingestion path: register ONLY the root catalog-info.yaml here.
# Nested Location entities inside catalog-info.yaml (type: url absolute GitHub
# targets) pull fleet-components.yaml + soundcheck-scorecards.yaml +
# l0-boundary-scorecards.yaml + ownership.yaml + templates.
# Do NOT also list those YAML files as sibling catalog.locations — that double-
# registers Components/Resources/Groups (Bugbot #654 / P2 ownership).

catalog:
  rules:
    - allow:
        - Component
        - System
        - API
        - Resource
        - Location
        - Template
        - Group
        - User
  locations:
    - type: url
      target: https://github.com/valentinflorezarbelaez-ai/Glorian-System-/blob/main/catalog-info.yaml
      rules:
        - allow: [Component, System, Location, API, Resource, Template, Group, User]

