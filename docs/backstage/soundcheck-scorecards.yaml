  name: eos-soundcheck-pillar-law-v
  title: Soundcheck Pillar — Law V Conformance
  description: Weighted pillar LAW_V_CONFORMANCE (0.25). Backstage check id eos.soundcheck.law-v-conformance.
  annotations:
    eos.glorian/pillar-id: LAW_V_CONFORMANCE
    eos.glorian/pillar-weight: "0.25"
    eos.glorian/backstage-check-id: eos.soundcheck.law-v-conformance
    eos.glorian/fleet-posture: CONTROL_PLANE_ONLY
  tags:
    - soundcheck
    - pillar
spec:
  type: scorecard-pillar
  owner: user:valentin-florez-arbelaez
  system: eos-sovereign-mesh
  dependencyOf:
    - resource:default/eos-soundcheck-fleet-matrix

