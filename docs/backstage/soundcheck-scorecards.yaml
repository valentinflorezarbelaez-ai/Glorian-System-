# EOS / Spotify Soundcheck scorecard Resources for Backstage (P1).
# Presentation mapping only — scoring SoT remains Layer-0:
#   src/core/eosBackstageSoundcheckScorecard.ts (SPEC-299)
# Receipt SoT:
#   docs/evidence/SOUNDCHECK_SCORECARD_RECEIPT.json
# Portal plugins MUST display receipt values; MUST NOT invent a second score engine.
# Default fleet posture is CONTROL_PLANE_ONLY until dogfood proves FLEET_VERIFIED.

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: eos-soundcheck-fleet-matrix
  title: EOS Soundcheck Fleet Matrix
  description: Aggregate fleet Soundcheck matrix (pillars, tiers, DORA). Values come from the EOS receipt — never recomputed in Backstage.
  annotations:
    eos.glorian/scorecard-engine: src/core/eosBackstageSoundcheckScorecard.ts
    eos.glorian/spec-ref: SPEC-299
    eos.glorian/receipt-path: docs/evidence/SOUNDCHECK_SCORECARD_RECEIPT.json
    eos.glorian/pillar-map: docs/backstage/scorecard-pillar-map.json
    eos.glorian/fleet-posture: CONTROL_PLANE_ONLY
    eos.glorian/portal-must-not-rescore: "true"
  tags:
    - soundcheck
    - scorecard
    - fleet
  links:
    - url: https://github.com/valentinflorezarbelaez-ai/Glorian-System-/blob/main/docs/evidence/SOUNDCHECK_SCORECARD_RECEIPT.json
      title: Soundcheck Receipt (JSON)
      icon: catalog
    - url: https://github.com/valentinflorezarbelaez-ai/Glorian-System-/blob/main/docs/backstage/scorecard-pillar-map.json
      title: Pillar → Scorecard Map
      icon: docs
    - url: https://github.com/valentinflorezarbelaez-ai/Glorian-System-/blob/main/openspec/specs/SPEC-299-BACKSTAGE-SOUNDCHECK-SCORECARD.md
      title: SPEC-299
      icon: docs
spec:
  type: scorecard
  owner: user:valentin-florez-arbelaez
  system: eos-sovereign-mesh
  dependsOn:
    - component:default/eos-system-control-plane

---
