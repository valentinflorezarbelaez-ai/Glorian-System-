# Golden-path CI for satellites scaffolded from templates/backstage.
# Outside Glorian Layer-0 control plane — keep dependencies: {} fail-closed.
name: Verify Strict

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-strict:
    name: npm run verify:strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Canonical gate (no runtime npm deps)
        run: npm run verify:strict
