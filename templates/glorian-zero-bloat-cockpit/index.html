<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glorian Cockpit · Cabina de Vuelo Zero-Bloat</title>
  <meta name="description" content="Plantilla minimalista de cabina de vuelo: <15 KB, cero frameworks, contraste WCAG AAA y telemetría en microsegundos." />
  <meta name="theme-color" content="#050508" />
  <style>
    :root {
      --bg: #050508;
      --card: #0d0f17;
      --border: #1e2235;
      --text: #f8fafc;
      --muted: #848ea0;
      --accent: #00f0ff;
      --gold: #f59e0b;
      --emerald: #10b981;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }
    .cockpit {
      width: 100%;
      max-width: 840px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge-live {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }
    .meta {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .card-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-value {
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
    }
    .card-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .action-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
    }
    input {
      flex: 1;
      background: #020305;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 0.6rem 0.85rem;
      border-radius: 6px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      font-weight: 700;
      font-size: 0.82rem;
      font-family: var(--mono);
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.88; }
    .terminal {
      background: #010204;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem;
      font-family: var(--mono);
      font-size: 0.76rem;
      color: #94a3b8;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="cockpit">
    <header class="header">
      <div class="title">
        <span class="badge-live" aria-hidden="true"></span>
        <span>GLORIAN COCKPIT</span>
      </div>
      <div class="meta" id="clock">0.000 ms</div>
    </header>

    <section class="grid" aria-label="Telemetría de la Flota">
      <article class="card">
        <span class="card-label">Estado de la Mónada</span>
        <span class="card-value" style="color: var(--emerald);">100% SOBERANO</span>
        <span class="card-sub">Quórum intacto · 0 regresiones</span>
      </article>
      <article class="card">
        <span class="card-label">Latencia del Servidor</span>
        <span class="card-value" id="latency-stat">0.08 ms</span>
        <span class="card-sub">Lectura SQLite WAL en memoria</span>
      </article>
      <article class="card">
        <span class="card-label">Memoria del Proceso</span>
        <span class="card-value" style="color: var(--gold);">&lt; 28 MB</span>
        <span class="card-sub">Cero grasa · 0 dependencias npm</span>
      </article>
    </section>

    <section class="action-panel" aria-label="Consola de Despacho">
      <span class="card-label">Despacho de Tarea Inmediata</span>
      <form class="input-row" id="task-form">
        <input type="text" id="task-input" placeholder="Escribe directiva o tarea..." autocomplete="off" required />
        <button type="submit">Ejecutar ⚡</button>
      </form>
      <pre class="terminal" id="terminal-log">// Esperando directiva. Cero context-switching activo.</pre>
    </section>
  </main>

  <script>
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const log = document.getElementById('terminal-log');
    const latStat = document.getElementById('latency-stat');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;
      const t0 = performance.now();
      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: val })
        });
        const data = await res.json();
        const roundtrip = (performance.now() - t0).toFixed(2);
        latStat.textContent = `${data.latency_ms || roundtrip} ms`;
        log.textContent = `[${new Date().toISOString()}] Directiva: "${val}"\n↳ Servidor: ${JSON.stringify(data, null, 2)}\n↳ Latencia de viaje: ${roundtrip} ms\n\n` + log.textContent;
        input.value = '';
      } catch (err) {
        log.textContent = `[ERROR] ${err.message}\n` + log.textContent;
      }
    });
  </script>
</body>
</html>
